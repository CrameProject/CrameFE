name: CD - Deploy to Personal Repo

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    name: 🚀 Deploy to Personal Repository
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 전체 히스토리 가져오기

      - name: 📦 Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: 🧰 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🛠 Build project
        run: pnpm build

      - name: 🚀 Push to personal repository
        uses: cpina/github-action-push-to-another-repository@main
        env:
          SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
        with:
          source-directory: "."
          destination-github-username: "gyeongbibin"
          destination-repository-name: "CrameFE"
          user-email: ${{ secrets.EMAIL }}
          user-name: "GitHub Actions"
          commit-message: |
            Deploy: ${{ github.event.head_commit.message }}
            Triggered by: ${{ github.actor }}
            Commit: ${{ github.sha }}
            Source: ${{ github.repository }}
          target-branch: "main"
          skip-checkout: true
          force: false

      - name: ✅ Deployment notification
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "Deployed commit: ${{ github.sha }}"
          echo "Personal repo: gyeongbibin/CrameFE"
